name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Build (tsc project references + frontend)
        run: npm run build

      - name: Backend tests (governance suite)
        working-directory: apps/backend
        env:
          # Hermetic by design: tests mock every network fetch; the memory
          # store wipes state per test. No chain, no keys, no network needed.
          PERSISTENCE_MODE: memory
        run: npm test
